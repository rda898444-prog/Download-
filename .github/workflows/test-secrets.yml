name: Test Telegram Secrets

on:
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check Secrets Existence and Format
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          echo "🔍 در حال بررسی سکرت‌ها..."
          echo "----------------------------------------"
          
          # 1. Check API_ID
          if [ -z "$API_ID" ]; then
            echo "❌ خطا: API_ID خالی است یا در تنظیمات گیت‌هاب ذخیره نشده است."
          else
            echo "✅ API_ID پیدا شد. طول آن: ${#API_ID} کاراکتر"
            # Check if it's numeric
            if [[ "$API_ID" =~ ^[0-9]+$ ]]; then
              echo "✅ API_ID یک عدد معتبر است."
            else
              echo "⚠️ هشدار: API_ID باید فقط شامل اعداد باشد. شاید فاصله یا حرف اضافی دارد."
            fi
          fi
          
          echo "----------------------------------------"
          
          # 2. Check API_HASH
          if [ -z "$API_HASH" ]; then
            echo "❌ خطا: API_HASH خالی است یا در تنظیمات گیت‌هاب ذخیره نشده است."
          else
            echo "✅ API_HASH پیدا شد. طول آن: ${#API_HASH} کاراکتر"
          fi
          
          echo "----------------------------------------"
          
          # 3. Check SESSION_STRING
          if [ -z "$SESSION_STRING" ]; then
            echo "❌ خطا: TELEGRAM_SESSION خالی است یا در تنظیمات گیت‌هاب ذخیره نشده است."
          else
            echo "✅ TELEGRAM_SESSION پیدا شد. طول آن: ${#SESSION_STRING} کاراکتر"
          fi

          echo "----------------------------------------"
          
          # 4. Python Test (Exactly like the main script)
          echo "🐍 تست نهایی در پایتون:"
          python - <<'PY'
          import os
          try:
              api_id_str = os.environ.get("API_ID", "")
              if not api_id_str:
                  raise ValueError("API_ID is completely empty.")
                  
              api_id = int(api_id_str)
              print(f"✅ پایتون توانست API_ID را به عدد تبدیل کند: {api_id}")
              
              if len(os.environ.get("API_HASH", "")) == 0:
                  print("❌ API_HASH خالی است.")
              else:
                  print("✅ API_HASH در دسترس است.")
                  
              if len(os.environ.get("SESSION_STRING", "")) == 0:
                  print("❌ SESSION_STRING خالی است.")
              else:
                  print("✅ SESSION_STRING در دسترس است.")
                  
          except Exception as e:
              print(f"❌ خطا در پایتون: {e}")
              exit(1)
          PY
