name: Download and optimize video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL'
        required: true
        type: string
      tag:
        description: 'Release tag (مثلاً v1)'
        required: true
        default: 'v1'
        type: string

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg + requests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests

      - name: Download & faststart
        id: download
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          python - <<'PY'
          import os, subprocess, requests
          from pathlib import Path
          from urllib.parse import urlparse, unquote, quote

          url = os.environ["VIDEO_URL"]
          out_dir = Path("videos")
          out_dir.mkdir(exist_ok=True)

          filename = unquote(os.path.basename(urlparse(url).path)) or "video.mp4"
          if not filename.lower().endswith((".mp4", ".mov", ".m4v")):
              filename += ".mp4"

          raw = out_dir / f".raw_{filename}"
          final = out_dir / filename

          print(f"⬇️  Downloading: {url}")
          with requests.get(url, stream=True, timeout=120) as r:
              r.raise_for_status()
              with open(raw, "wb") as f:
                  for chunk in r.iter_content(chunk_size=1024 * 1024):
                      if chunk:
                          f.write(chunk)

          print("🔧 Moving moov atom to the front...")
          subprocess.run([
              "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
              "-i", str(raw), "-c", "copy",
              "-movflags", "+faststart", str(final),
          ], check=True)

          raw.unlink()
          print(f"✅ Done: {final}  ({final.stat().st_size / 1024 / 1024:.1f} MB)")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"filename_url={quote(final.name)}\n")
          PY

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: videos/*.mp4
          fail_on_unmatched_files: true

      - name: Print download link
        run: |
          LINK="https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/${{ steps.download.outputs.filename_url }}"
          echo "🔗 Download link: $LINK"
          {
            echo "### 🔗 لینک دانلود"
            echo ""
            echo '```'
            echo "$LINK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
